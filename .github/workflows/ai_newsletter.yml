name: "🤖 AI Newsletter Action"

on:
  schedule:
    # 16:00 UTC = 18:00 MEZ (Mittwochs und Sonntags)
    - cron: "0 16 * * 0,3"
  workflow_dispatch:

jobs:
  run-ai-newsletter:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          
      - name: Install Dependencies
        run: pip install -r requirements.txt
        
      - name: Run AI Newsletter Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python newsletter_ai.py
